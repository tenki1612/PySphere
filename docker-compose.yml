version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pysphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pysphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pysphere_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pysphere_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pysphere} -d ${POSTGRES_DB:-pysphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pysphere-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pysphere}:${POSTGRES_PASSWORD:-pysphere_dev_password}@db:5432/${POSTGRES_DB:-pysphere_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_for_development_minimum_32_characters}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./curriculum:/curriculum

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pysphere-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
    driver: local
